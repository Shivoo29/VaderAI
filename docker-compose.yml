version: '3.8'

services:
  vader-ai-backend:
    build: .
    container_name: vader-ai-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=sqlite:///./vader_ai.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./audio_cache:/app/audio_cache
      - ./vader_ai.db:/app/vader_ai.db
    restart: unless-stopped

  vader-ai-frontend:
    image: node:18-alpine
    container_name: vader-ai-frontend
    working_dir: /app
    command: sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - vader-ai-backend
    restart: unless-stopped

networks:
  default:
    name: vader-ai-network
